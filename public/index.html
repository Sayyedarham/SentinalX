<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SentinalX · Detection Operations</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark"><span></span><span></span><span></span></div>
          <div><div class="brand-name">sentinal<span>x</span></div><div class="brand-subtitle">detection operations</div></div>
        </div>

        <div class="workspace-label">WORKSPACE</div>
        <div class="workspace-select"><div class="workspace-dot"></div><div><strong>Acme Security Lab</strong><small>Production telemetry</small></div><span class="chevron">⌄</span></div>

        <nav class="nav">
          <div class="nav-section">MONITOR</div>
          <button class="nav-item active" data-view="overview"><span class="nav-icon">◈</span><span>Overview</span><span class="nav-count">4</span></button>
          <button class="nav-item" data-view="incidents"><span class="nav-icon">⊙</span><span>Incidents</span><span class="nav-count alert">2</span></button>
          <button class="nav-item" data-view="events"><span class="nav-icon">⌁</span><span>Event stream</span></button>
          <div class="nav-section">ENGINEER</div>
          <button class="nav-item" data-view="detections"><span class="nav-icon">✦</span><span>Detection studio</span><span class="nav-new">NEW</span></button>
          <button class="nav-item" data-view="replay"><span class="nav-icon">▷</span><span>Replay lab</span></button>
          <button class="nav-item" data-view="feedback"><span class="nav-icon">◌</span><span>Learning loop</span></button>
          <div class="nav-section">GOVERN</div>
          <button class="nav-item" data-view="audit"><span class="nav-icon">▤</span><span>Audit trail</span></button>
          <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
        </nav>

        <div class="sidebar-footer">
          <div class="agent-card"><div class="agent-orb"><span></span></div><div><strong>Analyst agent</strong><small><i></i> Monitoring live</small></div><button class="dots">•••</button></div>
          <div class="user-card"><div class="avatar">AM</div><div><strong>Alex Morgan</strong><small>Senior Analyst</small></div><span class="chevron">⌄</span></div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb"><span>Acme Security Lab</span><b>/</b><strong id="breadcrumb-title">Overview</strong></div>
          <div class="top-actions"><div class="live-status"><span class="pulse"></span>LIVE PIPELINE</div><button class="icon-button" title="Search">⌕</button><button class="icon-button" title="Notifications">♧<i class="notification-dot"></i></button><div class="top-avatar">AM</div></div>
        </header>
        <div id="toast" class="toast"></div>
        <section id="app" class="page"></section>
      </main>
    </div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
